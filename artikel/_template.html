    // Reading progress bar
    (function(){
      var bar=document.getElementById('readingProgress');
      var article=document.querySelector('.artikel-single__body');
      if(!bar||!article)return;
      window.addEventListener('scroll',function(){
        var rect=article.getBoundingClientRect();
        var start=article.offsetTop-window.innerHeight;
        var end=article.offsetTop+article.offsetHeight;
        var scrolled=window.scrollY;
        var progress=Math.min(Math.max((scrolled-start)/(end-start-window.innerHeight),0),1);
        bar.style.width=(progress*100)+'%';
      });
    })();
    </script>
