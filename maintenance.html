    <script>
    (async function() {
        try {
            const res = await fetch('https://app.undangyah.id/wp-json/undangyah/v1/landing/maintenance-config');
            if (!res.ok) return;
            const cfg = await res.json();

            // Title
            if (cfg.title) document.getElementById('m-title').textContent = cfg.title;

            // Subtitle
            if (cfg.subtitle) document.getElementById('m-subtitle').textContent = cfg.subtitle;

            // Badge
            const badge = document.getElementById('m-badge');
            if (cfg.badge_visible === false) {
                badge.classList.add('hidden');
            } else {
                badge.classList.remove('hidden');
                if (cfg.badge_text) document.getElementById('m-badge-text').textContent = cfg.badge_text;
            }

            // Primary button
            const btnPrimary = document.getElementById('m-btn-primary');
            if (cfg.btn_primary_visible === false) {
                btnPrimary.classList.add('hidden');
            } else {
                btnPrimary.classList.remove('hidden');
                if (cfg.btn_primary_url) btnPrimary.href = cfg.btn_primary_url;
                if (cfg.btn_primary_text) document.getElementById('m-btn-primary-text').textContent = cfg.btn_primary_text;
            }

            // Secondary button
            const btnSecondary = document.getElementById('m-btn-secondary');
            if (cfg.btn_secondary_visible && cfg.btn_secondary_text) {
                btnSecondary.classList.remove('hidden');
                if (cfg.btn_secondary_url) btnSecondary.href = cfg.btn_secondary_url;
                document.getElementById('m-btn-secondary-text').textContent = cfg.btn_secondary_text;
            } else {
                btnSecondary.classList.add('hidden');
            }
        } catch (e) {
            // Fallback: show defaults (already in HTML)
        }
    })();
    </script>
